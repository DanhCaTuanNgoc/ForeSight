<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="512" height="512" fill="none">
  <defs>
    <linearGradient id="foresightEyeUpper" x1="4" y1="32" x2="60" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.3" />
      <stop offset="25%" stop-color="#A855F7" />
      <stop offset="50%" stop-color="#E879F9" />
      <stop offset="75%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0.3" />
    </linearGradient>
    <linearGradient id="foresightEyeLower" x1="4" y1="32" x2="60" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4338CA" stop-opacity="0.3" />
      <stop offset="30%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="70%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4338CA" stop-opacity="0.3" />
    </linearGradient>
    <radialGradient id="foresightIrisGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="20%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#A855F7" />
      <stop offset="85%" stop-color="#4C1D95" />
      <stop offset="100%" stop-color="#0B0B14" />
    </radialGradient>
    <radialGradient id="foresightPupilGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#67E8F9" />
      <stop offset="80%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#4C1D95" />
    </radialGradient>
    <filter id="foresightNeonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="32" cy="32" r="20" fill="#7C3AED" opacity="0.25" filter="url(#foresightNeonGlow)" />

  <!-- Outer Cybernetic Eyelid Contour -->
  <path d="M 6 32 C 16 13, 48 13, 58 32" stroke="url(#foresightEyeUpper)" stroke-width="2.8" stroke-linecap="round" filter="url(#foresightNeonGlow)" />
  <path d="M 6 32 C 16 51, 48 51, 58 32" stroke="url(#foresightEyeLower)" stroke-width="2.8" stroke-linecap="round" filter="url(#foresightNeonGlow)" />

  <!-- Corner Precision Ticks -->
  <line x1="2" y1="32" x2="8" y2="32" stroke="#A855F7" stroke-width="2" stroke-linecap="round" />
  <line x1="56" y1="32" x2="62" y2="32" stroke="#A855F7" stroke-width="2" stroke-linecap="round" />

  <!-- Brow Dash Accent -->
  <path d="M 18 19 L 26 14 L 38 14 L 46 19" stroke="#C084FC" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="4 3" opacity="0.75" />

  <!-- Iris Circle -->
  <circle cx="32" cy="32" r="14.5" fill="url(#foresightIrisGrad)" stroke="#A855F7" stroke-width="1.5" opacity="0.9" />

  <!-- Radar Tech Grid -->
  <circle cx="32" cy="32" r="11" fill="none" stroke="#38BDF8" stroke-width="1" stroke-dasharray="2 3" opacity="0.7" />
  <circle cx="32" cy="32" r="7.5" fill="none" stroke="#C084FC" stroke-width="1" opacity="0.8" />

  <!-- Vision Nexus Core Pupil -->
  <circle cx="32" cy="32" r="5" fill="url(#foresightPupilGrad)" filter="url(#foresightNeonGlow)" />
  <circle cx="30" cy="30" r="1.5" fill="#FFFFFF" opacity="0.9" />
  <line x1="18" y1="32" x2="46" y2="32" stroke="#67E8F9" stroke-width="1" stroke-linecap="round" opacity="0.65" />
</svg>
